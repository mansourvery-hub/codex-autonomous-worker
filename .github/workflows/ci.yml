name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run Cargo Tests
        run: cargo test --all

      - name: Build Release Binary
        run: cargo build --release

      - name: Check shell scripts
        run: bash -n install.sh
